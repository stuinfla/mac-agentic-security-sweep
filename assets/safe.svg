<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="The scan reads your Mac and writes only a results folder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Read-only by design</title>
  <rect width="900" height="250" rx="18" fill="#0d1b2a"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <rect x="50" y="60" width="270" height="130" rx="14" fill="#12314d" stroke="#2f5f8f" stroke-width="2"/>
    <text x="185" y="96" fill="#fff" font-size="17" font-weight="700">Your Mac</text>
    <text x="185" y="124" fill="#8fb4d6" font-size="13">settings, startup items, apps,</text>
    <text x="185" y="144" fill="#8fb4d6" font-size="13">extensions, network state</text>
    <text x="185" y="172" fill="#3ddc97" font-size="12.5">unchanged during the scan</text>
    <g>
      <path d="M335 125H565" stroke="#3ddc97" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.4s" repeatCount="indefinite"/></path>
      <path d="M565 125l-12-8v16z" fill="#3ddc97"/>
      <text x="450" y="108" fill="#3ddc97" font-size="14" font-weight="700">reads</text>
      <g transform="translate(450 166)"><circle r="19" fill="#12314d" stroke="#e5605a" stroke-width="2.5"/><path d="M-8 -8l16 16m0 -16l-16 16" stroke="#e5605a" stroke-width="3.5" stroke-linecap="round"/></g>
      <text x="450" y="206" fill="#e5605a" font-size="14" font-weight="700">no writes, no uploads</text>
      <circle r="6" fill="#fff"><animateMotion dur="2.4s" repeatCount="indefinite" path="M335 125H565"/></circle>
    </g>
    <rect x="580" y="60" width="270" height="130" rx="14" fill="#12314d" stroke="#3ddc97" stroke-width="2"/>
    <text x="715" y="96" fill="#fff" font-size="17" font-weight="700">results/ folder</text>
    <text x="715" y="124" fill="#8fb4d6" font-size="13">the only thing the scan creates,</text>
    <text x="715" y="144" fill="#8fb4d6" font-size="13">next to the kit, on your disk</text>
    <text x="715" y="172" fill="#3ddc97" font-size="12.5">delete it any time</text>
  </g>
</svg>
