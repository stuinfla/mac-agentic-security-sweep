<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Mac Claude Security Sweep: a radar sweep scanning a laptop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Mac Claude Security Sweep</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b2a"/><stop offset="1" stop-color="#14263b"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc97" stop-opacity="0"/><stop offset="1" stop-color="#3ddc97" stop-opacity=".55"/></linearGradient>
    <clipPath id="screen"><rect x="92" y="78" width="256" height="156" rx="6"/></clipPath>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <!-- laptop -->
  <rect x="80" y="66" width="280" height="180" rx="12" fill="#1b3350" stroke="#2f5f8f" stroke-width="2"/>
  <rect x="92" y="78" width="256" height="156" rx="6" fill="#0a1522"/>
  <path d="M52 252h336l-18 14H70z" fill="#1b3350" stroke="#2f5f8f" stroke-width="2"/>
  <g clip-path="url(#screen)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#7fb8e8">
    <text x="104" y="102">LaunchAgents ........ <tspan fill="#3ddc97">ok</tspan></text>
    <text x="104" y="124">Login items ......... <tspan fill="#3ddc97">ok</tspan></text>
    <text x="104" y="146">Browser extensions .. <tspan fill="#3ddc97">ok</tspan></text>
    <text x="104" y="168">Permissions (TCC) ... <tspan fill="#3ddc97">ok</tspan></text>
    <text x="104" y="190">Network ............. <tspan fill="#3ddc97">ok</tspan></text>
    <text x="104" y="212">Dev &amp; AI tooling ..... <tspan fill="#3ddc97">ok</tspan></text>
    <rect x="92" y="78" width="70" height="156" fill="url(#beam)">
      <animate attributeName="x" values="60;300;60" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="78" width="256" height="2" fill="#3ddc97" opacity=".0">
      <animate attributeName="opacity" values="0;.8;0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- radar rings -->
  <g transform="translate(250 156)" fill="none" stroke="#3ddc97">
    <circle r="40" stroke-opacity=".0"><animate attributeName="r" values="10;120" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="40" stroke-opacity=".0"><animate attributeName="r" values="10;120" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- title -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="420" y="118" font-size="40" font-weight="700" fill="#ffffff">Mac Claude</text>
    <text x="420" y="162" font-size="40" font-weight="700" fill="#3ddc97">Security Sweep</text>
    <text x="420" y="196" font-size="17" fill="#a9c7e4">A read-only security check for your Mac,</text>
    <text x="420" y="219" font-size="17" fill="#a9c7e4">run by Claude. Findings first. Fixes only if you say yes.</text>
    <g transform="translate(420 238)">
      <rect width="118" height="26" rx="13" fill="#10304a" stroke="#2f5f8f"/><text x="59" y="18" font-size="12" fill="#cfe6fb" text-anchor="middle">read-only scan</text>
      <rect x="128" width="122" height="26" rx="13" fill="#10304a" stroke="#2f5f8f"/><text x="189" y="18" font-size="12" fill="#cfe6fb" text-anchor="middle">scripts never upload</text>
      <rect x="260" width="118" height="26" rx="13" fill="#10304a" stroke="#2f5f8f"/><text x="319" y="18" font-size="12" fill="#cfe6fb" text-anchor="middle">undoable fixes</text>
    </g>
  </g>
</svg>
