<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Four stages: scan, report, optional cleanup, optional protection" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How a sweep runs</title>
  <rect width="900" height="220" rx="18" fill="#0d1b2a"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <path d="M150 100H750" stroke="#2f5f8f" stroke-width="3" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" values="28;0" dur="1.6s" repeatCount="indefinite"/></path>
    <g>
      <circle cx="120" cy="100" r="34" fill="#12314d" stroke="#3ddc97" stroke-width="2.5"/>
      <path d="M104 100l11 11 20-22" fill="none" stroke="#3ddc97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="120" y="160" fill="#fff" font-size="17" font-weight="700">1. Scan</text>
      <text x="120" y="182" fill="#8fb4d6" font-size="13">read-only</text>
    </g>
    <g>
      <circle cx="320" cy="100" r="34" fill="#12314d" stroke="#3ddc97" stroke-width="2.5"/>
      <rect x="304" y="84" width="32" height="32" rx="4" fill="none" stroke="#3ddc97" stroke-width="3"/><path d="M310 95h20M310 102h20M310 109h12" stroke="#3ddc97" stroke-width="3" stroke-linecap="round"/>
      <text x="320" y="160" fill="#fff" font-size="17" font-weight="700">2. Report</text>
      <text x="320" y="182" fill="#8fb4d6" font-size="13">plain language</text>
    </g>
    <g>
      <circle cx="520" cy="100" r="34" fill="#12314d" stroke="#f2b84b" stroke-width="2.5" stroke-dasharray="5 4"/>
      <path d="M504 112l24-24m-8-4l12 12" fill="none" stroke="#f2b84b" stroke-width="4" stroke-linecap="round"/>
      <text x="520" y="160" fill="#fff" font-size="17" font-weight="700">3. Clean up</text>
      <text x="520" y="182" fill="#8fb4d6" font-size="13">optional, one item at a time</text>
    </g>
    <g>
      <circle cx="720" cy="100" r="34" fill="#12314d" stroke="#f2b84b" stroke-width="2.5" stroke-dasharray="5 4"/>
      <path d="M720 82l16 6v12c0 10-7 17-16 20-9-3-16-10-16-20V88z" fill="none" stroke="#f2b84b" stroke-width="3.5" stroke-linejoin="round"/>
      <text x="720" y="160" fill="#fff" font-size="17" font-weight="700">4. Protect</text>
      <text x="720" y="182" fill="#8fb4d6" font-size="13">optional alerts going forward</text>
    </g>
    <circle r="7" fill="#3ddc97"><animateMotion dur="5s" repeatCount="indefinite" path="M120 100H720"/></circle>
    <text x="450" y="38" fill="#a9c7e4" font-size="14">Nothing changes on your Mac until step 3, and only for items you approve.</text>
  </g>
</svg>
