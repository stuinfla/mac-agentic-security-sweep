<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Nine areas the sweep checks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>What the sweep looks at</title>
  <rect width="900" height="340" rx="18" fill="#0d1b2a"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="450" y="38" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Nine places a Mac can hide things</text>
    <g id="cells" font-size="14">
      <g transform="translate(40 62)"><rect width="260" height="74" rx="10" fill="#12314d" stroke="#2f5f8f"><animate attributeName="stroke" values="#2f5f8f;#3ddc97;#2f5f8f" dur="9s" begin="0s" repeatCount="indefinite"/></rect><text x="16" y="30" fill="#fff" font-weight="700">Startup items</text><text x="16" y="52" fill="#8fb4d6" font-size="12.5">Launch agents, daemons, login items</text></g>
      <g transform="translate(320 62)"><rect width="260" height="74" rx="10" fill="#12314d" stroke="#2f5f8f"><animate attributeName="stroke" values="#2f5f8f;#3ddc97;#2f5f8f" dur="9s" begin="1s" repeatCount="indefinite"/></rect><text x="16" y="30" fill="#fff" font-weight="700">Browser extensions</text><text x="16" y="52" fill="#8fb4d6" font-size="12.5">Every profile, sideloaded ones too</text></g>
      <g transform="translate(600 62)"><rect width="260" height="74" rx="10" fill="#12314d" stroke="#2f5f8f"><animate attributeName="stroke" values="#2f5f8f;#3ddc97;#2f5f8f" dur="9s" begin="2s" repeatCount="indefinite"/></rect><text x="16" y="30" fill="#fff" font-weight="700">App permissions</text><text x="16" y="52" fill="#8fb4d6" font-size="12.5">Screen, keystrokes, full disk</text></g>
      <g transform="translate(40 152)"><rect width="260" height="74" rx="10" fill="#12314d" stroke="#2f5f8f"><animate attributeName="stroke" values="#2f5f8f;#3ddc97;#2f5f8f" dur="9s" begin="3s" repeatCount="indefinite"/></rect><text x="16" y="30" fill="#fff" font-weight="700">Traffic interception</text><text x="16" y="52" fill="#8fb4d6" font-size="12.5">Proxies, DNS, root certs, profiles</text></g>
      <g transform="translate(320 152)"><rect width="260" height="74" rx="10" fill="#12314d" stroke="#2f5f8f"><animate attributeName="stroke" values="#2f5f8f;#3ddc97;#2f5f8f" dur="9s" begin="4s" repeatCount="indefinite"/></rect><text x="16" y="30" fill="#fff" font-weight="700">Remote access</text><text x="16" y="52" fill="#8fb4d6" font-size="12.5">SSH keys, sharing, hidden accounts</text></g>
      <g transform="translate(600 152)"><rect width="260" height="74" rx="10" fill="#12314d" stroke="#2f5f8f"><animate attributeName="stroke" values="#2f5f8f;#3ddc97;#2f5f8f" dur="9s" begin="5s" repeatCount="indefinite"/></rect><text x="16" y="30" fill="#fff" font-weight="700">Code signing</text><text x="16" y="52" fill="#8fb4d6" font-size="12.5">Who signed it, when it arrived</text></g>
      <g transform="translate(40 242)"><rect width="260" height="74" rx="10" fill="#12314d" stroke="#2f5f8f"><animate attributeName="stroke" values="#2f5f8f;#3ddc97;#2f5f8f" dur="9s" begin="6s" repeatCount="indefinite"/></rect><text x="16" y="30" fill="#fff" font-weight="700">Dev and AI tooling</text><text x="16" y="52" fill="#8fb4d6" font-size="12.5">MCP servers, hooks, skills, packages</text></g>
      <g transform="translate(320 242)"><rect width="260" height="74" rx="10" fill="#12314d" stroke="#2f5f8f"><animate attributeName="stroke" values="#2f5f8f;#3ddc97;#2f5f8f" dur="9s" begin="7s" repeatCount="indefinite"/></rect><text x="16" y="30" fill="#fff" font-weight="700">Exposed secrets</text><text x="16" y="52" fill="#8fb4d6" font-size="12.5">File names only, never contents</text></g>
      <g transform="translate(600 242)"><rect width="260" height="74" rx="10" fill="#12314d" stroke="#2f5f8f"><animate attributeName="stroke" values="#2f5f8f;#3ddc97;#2f5f8f" dur="9s" begin="8s" repeatCount="indefinite"/></rect><text x="16" y="30" fill="#fff" font-weight="700">Network activity</text><text x="16" y="52" fill="#8fb4d6" font-size="12.5">What is talking out, and how much</text></g>
    </g>
  </g>
</svg>
