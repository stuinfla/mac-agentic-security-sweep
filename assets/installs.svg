<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Tools you try leave things behind on your Mac, and the sweep finds them" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Every tool you try can leave something behind</title>
  <rect width="900" height="300" rx="18" fill="#0d1b2a"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="450" y="36" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Try ten tools a month and your Mac keeps what they leave</text>
    <g font-size="13.5" fill="#cfe6fb">
      <g transform="translate(30 62)"><rect width="230" height="34" rx="8" fill="#12314d" stroke="#2f5f8f"/><text x="14" y="22">curl … | sh installers</text></g>
      <g transform="translate(30 106)"><rect width="230" height="34" rx="8" fill="#12314d" stroke="#2f5f8f"/><text x="14" y="22">npm, pip, brew packages</text></g>
      <g transform="translate(30 150)"><rect width="230" height="34" rx="8" fill="#12314d" stroke="#2f5f8f"/><text x="14" y="22">MCP servers, skills, hooks</text></g>
      <g transform="translate(30 194)"><rect width="230" height="34" rx="8" fill="#12314d" stroke="#2f5f8f"/><text x="14" y="22">browser extensions</text></g>
      <g transform="translate(30 238)"><rect width="230" height="34" rx="8" fill="#12314d" stroke="#2f5f8f"/><text x="14" y="22">demo apps and helpers</text></g>
    </g>
    <g stroke="#2f5f8f" stroke-width="2" fill="none" stroke-dasharray="5 6">
      <path d="M262 79C330 79 330 150 400 150"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M262 123C330 123 330 150 400 150"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M262 167C330 167 330 150 400 150"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M262 211C330 211 330 150 400 150"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M262 255C330 255 330 150 400 150"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/></path>
    </g>
    <g transform="translate(400 96)">
      <rect width="170" height="108" rx="14" fill="#12314d" stroke="#f2b84b" stroke-width="2"/>
      <text x="85" y="40" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Your Mac</text>
      <text x="85" y="62" fill="#a9c7e4" font-size="12" text-anchor="middle">startup items, permissions,</text>
      <text x="85" y="80" fill="#a9c7e4" font-size="12" text-anchor="middle">tokens in config files,</text>
      <text x="85" y="98" fill="#a9c7e4" font-size="12" text-anchor="middle">trusted certs, listeners</text>
    </g>
    <path d="M572 150H630" stroke="#3ddc97" stroke-width="3"/><path d="M630 150l-10-7v14z" fill="#3ddc97"/>
    <g transform="translate(640 80)">
      <rect width="230" height="140" rx="14" fill="#10304a" stroke="#3ddc97" stroke-width="2"/>
      <text x="115" y="34" fill="#3ddc97" font-size="15" font-weight="700" text-anchor="middle">The sweep tells you</text>
      <g font-size="13" fill="#cfe6fb"><text x="22" y="64">what is still there</text><text x="22" y="86">who signed it, and when</text><text x="22" y="108">what it can reach</text><text x="22" y="130">what to switch off</text></g>
      <circle cx="205" cy="60" r="5" fill="#3ddc97"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
